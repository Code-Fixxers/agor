name: Build Rust Android APK

on:
  push:
    branches:
      - cfx/agor
      - rust-android-client
      - 'cfx/**'
    paths:
      - apps/agor-rust-android/**
      - .github/workflows/build-rust-android-apk.yml
      - flake.nix
      - flake.lock
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rust-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Rust Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v17

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v12

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          VERSION_CODE=$(git rev-list --count HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          {
            echo "version_code=$VERSION_CODE"
            echo "version_name=$SHORT_SHA"
            echo "short_sha=$SHORT_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Build Agor+Hermes APK
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          nix develop .#rust-android -c bash -lc '
            set -euo pipefail
            cd apps/agor-rust-android
            AGOR_RUST_ANDROID_PACKAGE=agor-hermes-app ./scripts/android.sh build --locked
          '

      - name: Build Hermes-only APK
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          nix develop .#rust-android -c bash -lc '
            set -euo pipefail
            cd apps/agor-rust-android
            AGOR_RUST_ANDROID_PACKAGE=hermes-only-app ./scripts/android.sh build --locked
          '

      - name: Verify APK contents
        run: |
          # shellcheck disable=SC2016
          nix develop .#rust-android -c bash -lc '
            set -euo pipefail
            AGOR_APK="apps/agor-rust-android/target/dx/agor-hermes-app/debug/android/app/app/build/outputs/apk/debug/app-debug.apk"
            HERMES_APK="apps/agor-rust-android/target/dx/hermes-only-app/debug/android/app/app/build/outputs/apk/debug/app-debug.apk"

            test -f "$AGOR_APK"
            test -f "$HERMES_APK"

            for apk in "$AGOR_APK" "$HERMES_APK"; do
              if unzip -l "$apk" | grep -E "ggml|base\\.en"; then
                echo "::error::Whisper model binary must not be packaged into $apk"
                exit 1
              fi
            done

            unzip -p "$AGOR_APK" lib/arm64-v8a/libdioxusmain.so > /tmp/libdioxusmain.so
            llvm-readelf -l /tmp/libdioxusmain.so | awk "
              /LOAD/ {
                seen = 1
                if (\$NF != \"0x4000\") {
                  print \"LOAD segment is not 16KB aligned: \" \$0
                  bad = 1
                }
              }
              END {
                if (!seen || bad) {
                  exit 1
                }
              }
            "
          '

      - name: Collect APKs
        id: collect
        env:
          SHORT_SHA: ${{ steps.version.outputs.short_sha }}
        run: |
          set -euo pipefail
          mkdir -p dist

          AGOR_APK="apps/agor-rust-android/target/dx/agor-hermes-app/debug/android/app/app/build/outputs/apk/debug/app-debug.apk"
          HERMES_APK="apps/agor-rust-android/target/dx/hermes-only-app/debug/android/app/app/build/outputs/apk/debug/app-debug.apk"

          cp "$AGOR_APK" "dist/agor-rust-android-${SHORT_SHA}.apk"
          cp "$HERMES_APK" "dist/hermes-rust-android-${SHORT_SHA}.apk"

          echo "agor_apk=dist/agor-rust-android-${SHORT_SHA}.apk" >> "$GITHUB_OUTPUT"
          echo "hermes_apk=dist/hermes-rust-android-${SHORT_SHA}.apk" >> "$GITHUB_OUTPUT"

      - name: Upload Agor+Hermes APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agor-rust-android-${{ steps.version.outputs.short_sha }}
          path: ${{ steps.collect.outputs.agor_apk }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload Hermes-only APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-rust-android-${{ steps.version.outputs.short_sha }}
          path: ${{ steps.collect.outputs.hermes_apk }}
          if-no-files-found: error
          retention-days: 7

      - name: Publish rolling rust-android-latest release
        if: github.ref == 'refs/heads/rust-android-client' || github.ref == 'refs/heads/cfx/agor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHORT_SHA: ${{ steps.version.outputs.short_sha }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          APK_PATH: ${{ steps.collect.outputs.agor_apk }}
        run: |
          set -euo pipefail
          TAG="rust-android-latest"
          NOTES=$(cat <<EOF
          Rolling Rust/Dioxus Android build, overwritten on every push.

          - commit: \`${SHORT_SHA}\`
          - versionCode: \`${VERSION_CODE}\`
          - versionName: \`${VERSION_NAME}\`
          EOF
          )

          git tag -f "$TAG"
          git push origin "refs/tags/$TAG" --force

          gh release delete "$TAG" --yes --cleanup-tag=false 2>/dev/null || true
          STABLE_APK="dist/agor-rust-android.apk"
          cp "$APK_PATH" "$STABLE_APK"
          APK_SIZE=$(stat -c%s "$STABLE_APK")
          cat > dist/agor-android-manifest.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "commit": "${SHORT_SHA}",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/rust-android-latest/agor-rust-android.apk",
            "sizeBytes": ${APK_SIZE}
          }
          EOF
          gh release create "$TAG" \
            --title "Agor Rust Android - $SHORT_SHA" \
            --notes "$NOTES" \
            --prerelease \
            "$STABLE_APK" \
            "dist/agor-android-manifest.json"

      - name: Publish rolling rust-hermes-android-latest release
        if: github.ref == 'refs/heads/rust-android-client' || github.ref == 'refs/heads/cfx/agor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHORT_SHA: ${{ steps.version.outputs.short_sha }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          APK_PATH: ${{ steps.collect.outputs.hermes_apk }}
        run: |
          set -euo pipefail
          TAG="rust-hermes-android-latest"
          NOTES=$(cat <<EOF
          Rolling Hermes-only Rust/Dioxus Android build, overwritten on every push.

          - commit: \`${SHORT_SHA}\`
          - versionCode: \`${VERSION_CODE}\`
          - versionName: \`${VERSION_NAME}\`
          EOF
          )

          git tag -f "$TAG"
          git push origin "refs/tags/$TAG" --force

          gh release delete "$TAG" --yes --cleanup-tag=false 2>/dev/null || true
          STABLE_APK="dist/hermes-rust-android.apk"
          cp "$APK_PATH" "$STABLE_APK"
          APK_SIZE=$(stat -c%s "$STABLE_APK")
          cat > dist/hermes-android-manifest.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "commit": "${SHORT_SHA}",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/rust-hermes-android-latest/hermes-rust-android.apk",
            "sizeBytes": ${APK_SIZE}
          }
          EOF
          gh release create "$TAG" \
            --title "Hermes Rust Android - $SHORT_SHA" \
            --notes "$NOTES" \
            --prerelease \
            "$STABLE_APK" \
            "dist/hermes-android-manifest.json"

      - name: Summary
        env:
          SHORT_SHA: ${{ steps.version.outputs.short_sha }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          {
            echo "### Rust Android APKs"
            echo ""
            echo "- Commit: \`${SHORT_SHA}\`"
            echo "- versionCode: \`${VERSION_CODE}\`"
            echo "- versionName: \`${VERSION_NAME}\`"
            echo ""
            echo "Agor download: https://github.com/${{ github.repository }}/releases/download/rust-android-latest/agor-rust-android.apk"
            echo "Hermes download: https://github.com/${{ github.repository }}/releases/download/rust-hermes-android-latest/hermes-rust-android.apk"
          } >> "$GITHUB_STEP_SUMMARY"
