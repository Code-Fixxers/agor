name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - apps/agor-android/**
      - .github/workflows/build-android-apk.yml
  pull_request:
    branches:
      - main
    paths:
      - apps/agor-android/**
      - .github/workflows/build-android-apk.yml
  workflow_dispatch:
    inputs:
      with_whisper:
        description: Vendor whisper.cpp and build on-device transcription support
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      WITH_WHISPER: ${{ github.event_name == 'workflow_dispatch' && inputs.with_whisper || 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;27.1.12297006
            cmake;3.22.1

      - name: Cache Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/agor-android/**/*.gradle*', 'apps/agor-android/gradle/libs.versions.toml', 'apps/agor-android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache vendored whisper.cpp checkout
        if: env.WITH_WHISPER == 'true'
        uses: actions/cache@v4
        with:
          path: apps/agor-android/app/src/main/cpp/whisper.cpp
          key: whisper-cpp-v1.7.1

      - name: Vendor whisper.cpp
        if: env.WITH_WHISPER == 'true'
        working-directory: apps/agor-android
        run: bash scripts/sync-whisper.sh

      - name: Cache native CMake build (.cxx)
        uses: actions/cache@v4
        with:
          path: apps/agor-android/app/.cxx
          key: cxx-${{ runner.os }}-${{ env.WITH_WHISPER }}-${{ hashFiles('apps/agor-android/app/src/main/cpp/**', 'apps/agor-android/app/build.gradle.kts') }}
          restore-keys: |
            cxx-${{ runner.os }}-${{ env.WITH_WHISPER }}-

      - name: Make gradlew executable
        working-directory: apps/agor-android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: apps/agor-android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK with commit SHA
        id: rename
        working-directory: apps/agor-android
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short HEAD)
          SRC=app/build/outputs/apk/debug/app-debug.apk
          DEST="agor-android-debug-${SHORT_SHA}.apk"
          cp "$SRC" "$DEST"
          ls -la "$DEST"
          echo "apk_path=apps/agor-android/$DEST" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agor-android-debug-${{ steps.rename.outputs.short_sha }}
          path: ${{ steps.rename.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 7

      - name: Summary
        run: |
          {
            echo "### Agor Android debug APK"
            echo ""
            echo "- Commit: \`${{ steps.rename.outputs.short_sha }}\`"
            echo "- Whisper.cpp on-device transcription: \`${WITH_WHISPER}\`"
            echo "- Download: open the run page → **Artifacts** → \`agor-android-debug-${{ steps.rename.outputs.short_sha }}\`"
            echo ""
            echo "Install on a device:"
            echo "\`\`\`"
            echo "adb install -r agor-android-debug-${{ steps.rename.outputs.short_sha }}.apk"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
