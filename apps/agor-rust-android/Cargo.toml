[workspace]
members = [
    "crates/shared",
    "crates/hermes",
    "crates/agor",
    "apps/agor-hermes",
    "apps/hermes-only",
]
resolver = "2"

[workspace.dependencies]
dioxus = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde", "js"] }
url = { version = "2", features = ["serde"] }
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
pulldown-cmark = "0.12"
thiserror = "2"
sha2 = "0.10"
web-sys = { version = "0.3", features = ["Location", "Window"] }

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
