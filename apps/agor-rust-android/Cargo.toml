[package]
name = "agor-android"
version = "0.1.0"
edition = "2021"
description = "Agor Android client built with Rust and Dioxus"

[dependencies]
dioxus = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
url = { version = "2", features = ["serde"] }
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
pulldown-cmark = "0.12"
thiserror = "2"

# Socket.IO will be added when rust_socketio supports rustls natively
# or when we set up vendored OpenSSL for the Android target.
# For now, real-time events use REST polling as fallback.
